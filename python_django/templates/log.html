
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
     
</body>
</head>
<body style="background-color: rgb(95, 233, 113);">
    
    <style>
    body {
      background-color: #f0f2f5;
    }
    .form-container {
      margin-top: 100px;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="container form-container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-5">
      <div class="card p-4">
        <h4 class="text-center mb-4">Create Account</h4>
        <form action="#" method="POST">
           {% csrf_token %}
          <div class="mb-3">
            <label for="fullname" class="form-label">First Name</label>
            <input type="text" class="form-control" id="fullname" name="First Name" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="Email address" required />
          </div>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" />
          </div>
          <div class="mb-3">
            <label for="password1" class="form-label">Password</label>
            <input type="password" class="form-control" id="password1" name="password" required />
          </div>
          <div class="mb-3">
            <label for="password2" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="password2" name="Confirm Password" required />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-success">Register</button>
          </div>
          <div class="mt-3 text-center">
            <a href="{% url 'loginpage' %}">Already have an account? Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div>
    {% for message in messages%}
    <h2>{{message}}</h2>
    {% endfor %}
  </div>
    
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
