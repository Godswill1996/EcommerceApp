{% extends 'base.html' %}
{% block content %}




<div class="container">
<br/>


<div class="card mb-3" >
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{ items.image.url }}"class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <center>
        <h5 class="card-title">{{ items.name }}</h5>
        <p class="card-text">{{ items.description }}</p>

        {% if items.is_sale %}

          <div class="d-flex justify-content-center small text-warning mb-2">
           <div class="bi-staar-fill"></div>
            &nbsp;&nbsp;Sale!&nbsp;&nbsp;
             <div class="bi-star-fill"></div>
           </div>

          <!-- Product price-->
           <strike>
           ₦{{ items.price }}
          </strike>
           ₦{{ items.sale_price }}

        {% else %}
         ₦{{ items.price }}
        
        {% endif %}

        <br><br>
        
        <br><br>

        <a href="{% url 'ecommerce' %}" class="btn btn-secondary">Home</a>
        <button type="button" data-id="{{ items.id }}" class="btn btn-secondary" id="add-cart">Add to Cart</button>
       
        </center>
      </div>
    </div>
  </div>
</div>
</div>
            
            
<br/><br/><br/><br/>

<script>
// Add cart
$(document).on('click', '#add-cart', function(e){
    e.preventDefault();
    $.ajax({
        type: 'POST',
        url: "{% url 'cart_add' %}",
        data: {
            items_id:$('#add-cart').data('id'),
            items_qty: $('#qty-cart option:selected').text(),
            csrfmiddlewaretoken: '{{ csrf_token }}',
            action: 'post'

        },

        success: function(json){
          //console.log(json)
          document.getElementById("cart_quantity").textContent = json.qty
          location.reload();
        },

        error : function(xhr,errmsg,err){

        }



    });





})



</script>


        

{% endblock %}
